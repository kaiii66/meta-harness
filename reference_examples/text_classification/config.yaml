# Dataset split sizes — full datasets
dataset:
  num_train: 200
  num_val: 50
  num_test: 100
  overrides:
    # MCE tasks: use full official splits
    # USPTO:                     {num_train: 50, num_val: 30, num_test: 100}
    Symptom2Disease:           {num_train: 200, num_val: 50, num_test: 212}
    # LawBench:                  {num_train: 200, num_val: 50, num_test: 100}

# Inner loop settings
inner_loop:
  mode: offline      # "online" or "offline"
  num_epochs: 1      # For offline mode: 1 epoch for local server speed (was 5)
  temperature: 0.0   # LLM temperature (null = model default)
  eval_interval: 0   # 0 = no intermediate evals
  batch_size: 1
  seed: 42

# Models to test (inner-loop classifier model)
models:
  # - model: openai/gpt-4o-mini
  # Original paper model (requires OPENROUTER_API_KEY):
  # - model: openrouter/openai/gpt-oss-120b
  # W&B Inference (OpenAI-compatible): with api_base set, llm.py prepends
  # `openai/`, so the model name must be a real W&B Inference model id.
  # `google/gemma-4-31B-it` is NOT a valid id -> litellm errors -> 0 results.
  - model: Qwen/Qwen3-235B-A22B-Instruct-2507
    api_base: https://api.inference.wandb.ai/v1

# Benchmark sweep settings
benchmark:
  seeds: [42]              # multi-seed: [42, 123, 456]
  concurrency: 16

# Datasets to test
datasets:
  # - USPTO
  - Symptom2Disease
  # - LawBench

# Memory systems to test
memory_systems:
  baselines:
    - no_memory
    - fewshot_all
  proposed: []  # meta_harness.py writes candidate files into agents/ at runtime

# Proposer settings (which agent writes new memory systems each iteration)
proposer:
  # backend: claude            # original Claude Code CLI
  backend: opencode            # opencode CLI: open model + built-in context management
  # gpt-oss-120b emits malformed file writes (literal \n); Qwen-235B writes clean files.
  model_id: Qwen/Qwen3-235B-A22B-Instruct-2507
  api_base: https://api.inference.wandb.ai/v1
  provider: wandb              # opencode provider key (W&B Inference)
  # api_key defaults to WANDB_API_KEY env var when using W&B Inference
